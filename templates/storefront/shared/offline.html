<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="{{ brand_color|default:'#4f46e5' }}">
    <title>Offline - {{ store.name }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .offline-card {
            max-width: 28rem;
            width: 100%;
            background: #ffffff;
            padding: 2.25rem 2rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
            text-align: center;
        }
        .offline-badge {
            width: 4rem;
            height: 4rem;
            border-radius: 1rem;
            margin: 0 auto 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            background-color: {{ brand_color|default:'#4f46e5' }};
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #475569;
            margin-bottom: 1.5rem;
        }
        .retry-btn {
            display: inline-block;
            padding: 0.65rem 1.4rem;
            border-radius: 0.75rem;
            background-color: {{ brand_color|default:'#4f46e5' }};
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-badge">
            {{ store.name|slice:":1"|upper }}
        </div>
        <h1>You're Currently Offline</h1>
        <p>
            We couldn't reach <strong>{{ store.name }}</strong> right now. Please check your internet connection and try again to browse products or place an order.
        </p>
        <a href="{% url 'storefront:detail' store.slug %}" class="retry-btn">
            Retry Connection
        </a>
    </div>
</body>
</html>
