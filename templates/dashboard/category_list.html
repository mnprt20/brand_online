{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Categories</h1>
    <a href="{% url 'dashboard:category_add' %}" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">+ Add Category</a>
</div>
<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 border-b border-slate-200 text-slate-600">
            <tr>
                <th class="px-6 py-3">Name</th>
                <th class="px-6 py-3">Sort Order</th>
                <th class="px-6 py-3 text-right">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
            {% for category in categories %}
            <tr>
                <td class="px-6 py-4 font-medium">
                    <a href="{% url 'dashboard:category_detail' category.pk %}" class="hover:underline">{{ category.name }}</a>
                </td>
                <td class="px-6 py-4">{{ category.sort_order }}</td>
                <td class="px-6 py-4 text-right space-x-3">
                    <a href="{% url 'dashboard:category_edit' category.pk %}" class="text-indigo-600 hover:underline">Edit</a>
                    <a href="{% url 'dashboard:category_delete' category.pk %}" class="text-red-600 hover:underline">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="px-6 py-8 text-center text-slate-500">No categories yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
