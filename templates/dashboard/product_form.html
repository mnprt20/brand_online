{% extends "base.html" %}
{% block title %}Product Form{% endblock %}
{% block content %}
<div class="max-w-xl bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
    <h1 class="text-2xl font-bold mb-6">{% if object %}Edit Product{% else %}Add Product{% endif %}</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
            <p class="text-xs text-red-600 mt-1">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}
        <div class="flex space-x-3 pt-2">
            <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Save Product</button>
            <a href="{% url 'dashboard:product_list' %}" class="px-5 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-medium">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
