{% extends "base.html" %}
{% block title %}Store Settings{% endblock %}
{% block content %}
<div class="max-w-xl bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
    <h1 class="text-2xl font-bold mb-6">Store Settings</h1>
    {% if object.logo %}
    <div class="mb-4">
        <p class="text-xs text-slate-500 mb-1">Current Logo:</p>
        <img src="{{ object.logo.url }}" alt="{{ object.name }}" class="h-16 w-16 object-cover rounded">
    </div>
    {% endif %}
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
            <p class="text-xs text-red-600 mt-1">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}
        <div class="pt-2">
            <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Save Settings</button>
        </div>
    </form>
</div>
{% endblock %}
